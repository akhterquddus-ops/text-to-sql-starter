name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Build demo database
        run: python -m sqlassist.data.generate
      - name: Safety tests (validator vs SQL attacks)
        run: python -m eval.run --sql-attacks
